<!doctype html><html><head><meta charset="utf-8"><base href="/sim/"><style>html,body{margin:0;background:#0b1b30}#world{width:1024px;height:1024px}#labels{display:none}</style></head><body><div id="world"></div><div id="labels"></div><script type="module">
import {LabEngine} from './js/engine.js';
import {LabWorld} from './js/world.js';
const engine=new LabEngine();engine.advance(900);const world=new LabWorld(document.querySelector('#world'),document.querySelector('#labels'),()=>{});await world.ready;world.setQuality('high');world.renderer.setPixelRatio(1);world.resize();world.controls.enableDamping=false;world.update(engine,true);world.snap();world.render(1/30,true);
window.ready=world.loaded;window.engine=engine;window.world=world;
const poses=[{t:0,x:0,z:0,zoom:1.05,a:.63},{t:6,x:-5,z:3,zoom:1.65,a:.55},{t:13,x:2,z:3,zoom:1.85,a:.3},{t:21,x:-2,z:-2.5,zoom:1.65,a:.5},{t:29,x:7,z:0,zoom:1.65,a:.65},{t:37,x:0,z:0,zoom:1.05,a:.8},{t:44,x:0,z:0,zoom:1.1,a:1}];
window.renderFrame=i=>{let t=i/30;engine.advance(1);if(i===480)engine.setFlag('tubeDown',true);if(i===630)engine.setFlag('tubeDown',false);if(i%4===0)world.update(engine);let k=0;while(k<poses.length-2&&t>poses[k+1].t)k++;let a=poses[k],b=poses[k+1],u=Math.min(1,(t-a.t)/(b.t-a.t));u=u*u*(3-2*u);let mix=p=>a[p]+(b[p]-a[p])*u;let x=mix('x'),z=mix('z'),ang=mix('a');world.camera.position.set(x+Math.sin(ang)*43,34,z+Math.cos(ang)*43);world.controls.target.set(x,.2,z);world.camera.zoom=mix('zoom');world.camera.updateProjectionMatrix();world.render(1/30,true);};
window.capture=async()=>{const chunks=[];const encoder=new VideoEncoder({output:c=>{const bytes=new Uint8Array(c.byteLength);c.copyTo(bytes);chunks.push({bytes,timestamp:c.timestamp});},error:e=>{throw e}});encoder.configure({codec:'vp8',width:1024,height:1024,bitrate:4500000,framerate:30});for(let i=0;i<1320;i++){window.renderFrame(i);const f=new VideoFrame(world.renderer.domElement,{timestamp:Math.round(i*1e6/30)});encoder.encode(f,{keyFrame:i%180===0});f.close();if(i%15===0){await encoder.flush();window.progress=i;if(i%60===0)console.log('LABFLOW_FRAME',i,'/ 1320');await new Promise(r=>setTimeout(r,0));}}await encoder.flush();encoder.close();const header=new ArrayBuffer(32),v=new DataView(header);new Uint8Array(header).set([...new TextEncoder().encode('DKIF'),0,0,32,0,...new TextEncoder().encode('VP80')]);v.setUint16(12,1024,true);v.setUint16(14,1024,true);v.setUint32(16,30,true);v.setUint32(20,1,true);v.setUint32(24,chunks.length,true);const parts=[header];chunks.forEach((c,i)=>{let h=new ArrayBuffer(12),d=new DataView(h);d.setUint32(0,c.bytes.length,true);d.setBigUint64(4,BigInt(i),true);parts.push(h,c.bytes)});const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(parts));a.download='scene.ivf';a.click();return {frames:chunks.length,stats:world.getStats()};};
</script></body></html>
